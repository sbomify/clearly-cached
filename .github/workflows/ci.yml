---
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # ---------------------------------------------------------------------------
  # Image and binary, per architecture
  # ---------------------------------------------------------------------------
  # One compile per architecture, in the Dockerfile, on a native runner. The
  # binary is then copied out of the image that was just built rather than
  # compiled again beside it -- so what you download is the same bytes that run
  # in the container, not a second build that ought to match.
  #
  # Native rather than emulated because GitHub's arm64 runners are free for
  # public repositories, and an LTO release build under QEMU costs an order of
  # magnitude more wall-clock than running it on the architecture it targets.
  image:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
            target: x86_64-unknown-linux-musl
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write        # attach binaries to the release on a tag
      packages: write        # push the image to GHCR
      id-token: write        # mint the OIDC token Sigstore signs against
      attestations: write    # record the attestation against this repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Pull requests build but do not push: a fork PR has no write
      # credentials, and an unreviewed image should not reach the registry.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Pushed untagged, addressed only by digest: the tags belong on the
          # manifest list, not on either half of it.
          outputs: >-
            ${{ github.event_name == 'push'
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}

      - name: Export the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # -----------------------------------------------------------------------
      # The binary, taken out of the image rather than built again
      # -----------------------------------------------------------------------
      # `docker create` does not start anything, so this works against a scratch
      # image with no shell in it. Addressed by the digest just pushed, so there
      # is no question which build it came from.
      - name: Extract the binary
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          id=$(docker create --platform ${{ matrix.platform }} "${IMAGE}@${DIGEST}")
          docker cp "$id:/clearly-cached" "clearly-cached-${{ matrix.target }}"
          docker rm "$id" > /dev/null
          chmod +x "clearly-cached-${{ matrix.target }}"
          ls -l "clearly-cached-${{ matrix.target }}"
          file "clearly-cached-${{ matrix.target }}"

      # The same provenance the image gets. A binary is a deliverable here too,
      # and an unattested one is unverifiable however it was shipped.
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: clearly-cached-${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: github.event_name == 'push'
        with:
          name: clearly-cached-${{ matrix.target }}
          path: clearly-cached-${{ matrix.target }}
          if-no-files-found: error

      # A binary nobody can download is not much of a deliverable. Tags get a
      # release; ordinary pushes keep the artifact, which expires.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag \
            || echo "release already exists"
          gh release upload "${GITHUB_REF_NAME}" \
            "clearly-cached-${{ matrix.target }}" --clobber

  manifest:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Read the index digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Build-provenance attestation (SLSA v1)
      # -----------------------------------------------------------------------
      # Attests the manifest list rather than either architecture on its own:
      # the list is what a tag resolves to, and so what anyone actually pulls
      # and verifies. The image is `scratch` plus one static binary, so
      # verifying it is verifying the binary -- there is nothing else in it to
      # account for.
      #
      # push-to-registry stores the attestation alongside the image, so it can
      # be verified from a pull alone without consulting the GitHub API.
      #
      # Where this step is supported:
      #   * Public repository on any GitHub plan (Free, Pro, Team, Enterprise)
      #     -- uses the public-good Sigstore instance (Fulcio + Rekor).
      #   * Private / internal repository on GitHub Enterprise Cloud
      #     -- uses GitHub's private Sigstore instance (scoped to the repo).
      # Where it is NOT supported and the workflow will fail:
      #   * Private / internal repository on GitHub Free, Pro, or Team.
      #   * Any repository on GitHub Enterprise Server (self-hosted).
      # This repo is public, which is the first case.
      # Reference: https://github.com/actions/attest-build-provenance
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
